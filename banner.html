<style>

.chain em{font-style:normal;color:#ff7a1a;margin:0 6px}
</style></head><body>
<canvas id="c"></canvas><div class="scrim"></div>
<div class="txt">
 <div class="k"><i></i>Холодный каркасный ангар · под ключ</div>
 <h1>Ангар<br><span>10 × 50 м</span></h1>
 <p>Проект, изготовление, доставка, фундамент и монтаж. От договора до акта приёмки за 10 недель.</p>
 <div class="st"><div><b>500 м²</b><span>площадь</span></div><div><b>11</b><span>рам, шаг 5 м</span></div><div><b>5,5 м</b><span>конёк</span></div><div><b>16 %</b><span>НДС в смете</span></div></div>
</div>
<div class="chain">ПРОЕКТ<em>→</em>ЗАВОД<em>→</em>ДОСТАВКА<em>→</em>ФУНДАМЕНТ<em>→</em>МОНТАЖ</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const W=1600,Hh=600,V3=THREE.Vector3;
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(window.devicePixelRatio);r.setSize(W,Hh,false);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;
const sc=new THREE.Scene();
{const c=document.createElement('canvas');c.width=4;c.height=512;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,512);
 g.addColorStop(0,'#0c1626');g.addColorStop(.45,'#2b3550');g.addColorStop(.68,'#a4573a');g.addColorStop(.8,'#f0a35e');g.addColorStop(.86,'#ffd39a');g.addColorStop(1,'#3a2a1e');x.fillStyle=g;x.fillRect(0,0,4,512);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;sc.background=t;}
sc.fog=new THREE.Fog(0x4a3328,60,170);
const cam=new THREE.PerspectiveCamera(30,W/Hh,0.1,800);cam.position.set(-46,4.2,23);cam.lookAt(-4,3.4,-2);cam.setViewOffset(W,Hh,-W*0.2,0,W,Hh);
sc.add(new THREE.HemisphereLight(0x9fb8e0,0x3a2616,0.55));
const sun=new THREE.DirectionalLight(0xffb27a,2.3);sun.position.set(-70,16,-40);sun.target.position.set(0,0,0);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:30,bottom:-30,near:1,far:200});sc.add(sun,sun.target);
const rim=new THREE.DirectionalLight(0x6f9dff,0.5);rim.position.set(40,20,50);sc.add(rim);
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.1},o||{}));
function box(w,h,d,m,x,y,z,g){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(g||sc).add(o);return o;}
function rib(base,dark,n,rx,ry){const c=document.createElement('canvas');c.width=256;c.height=8;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,256,8);
 for(let i=0;i<n;i++){const p=i*256/n,w=256/n;const g=x.createLinearGradient(p,0,p+w,0);g.addColorStop(0,dark);g.addColorStop(.22,base);g.addColorStop(.6,base);g.addColorStop(.74,'rgba(255,255,255,.35)');g.addColorStop(1,dark);x.fillStyle=g;x.fillRect(p,0,w,8);}
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;return t;}
// ground
const gr=new THREE.Mesh(new THREE.PlaneGeometry(600,600),mat(0x2e2219,{roughness:1}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;sc.add(gr);
box(56,0.08,16,mat(0x45423e,{roughness:.95}),0,0.04,0); // concrete apron
const mD=mat(0x6e4a32,{roughness:1});let s=5;const rnd=()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};
for(let i=0;i<30;i++){const rr=10+rnd()*30;const d=new THREE.Mesh(new THREE.SphereGeometry(rr,20,8,0,Math.PI*2,0,Math.PI/2),mD);d.scale.y=.08+rnd()*.1;d.position.set(-40+rnd()*200,0,-60-rnd()*120);d.receiveShadow=true;sc.add(d);}
const H=4,RR=5.5,Wd=10,slope=Math.atan2(1.5,5),rl=Math.hypot(5,1.5);
const mFr=mat(0x7d93a8,{metalness:.55,roughness:.38});
const XC=4; // clad from -25 to XC
// frames everywhere
for(let x=-25;x<=25;x+=5){[-1,1].forEach(z=>{box(.16,H,.16,mFr,x,H/2+.1,z*5);const rf=box(.16,.21,rl+.1,mFr,x,(H+RR)/2+.15,z*2.5);rf.rotation.x=z*slope;});}
for(let k=0;k<4;k++){const f=(k+.5)/4;[-1,1].forEach(z=>box(25-XC,.1,.1,mFr,(XC+25)/2,H+1.5*f+.3,z*5*(1-f)));}
[1.2,2.4,3.6].forEach(y=>[-1,1].forEach(z=>box(25-XC,.1,.1,mFr,(XC+25)/2,y,z*5.13)));
// a few roof sheets beyond clad line (in progress)
const roofM=mat(0xffffff,{map:rib('#3f4956','#20262d',4,1,1),metalness:.55,roughness:.42});
for(let i=0;i<4;i++)[-1,1].forEach(z=>{const m=box(1.0,.045,rl+.5,roofM,XC+0.5+i,(H+RR)/2+.48,z*2.62);m.rotation.x=z*slope;});
// cladding
const LEN=XC+25,cx=(XC-25)/2;
const wallM=mat(0xffffff,{map:rib('#7b8794','#4c555f',4,LEN,1),metalness:.5,roughness:.42});
[-1,1].forEach(z=>box(LEN,H,.05,wallM,cx,H/2+.1,z*5.22));
const rM=mat(0xffffff,{map:rib('#3f4956','#20262d',4,1,1),metalness:.55,roughness:.42});rM.map.repeat.set(LEN+.6,1);rM.map.rotation=0;
[-1,1].forEach(z=>{const g=new THREE.BoxGeometry(LEN+.6,.05,rl+.5);const m=new THREE.Mesh(g,mat(0xffffff,{map:rib('#3f4956','#20262d',4,LEN+.6,1),metalness:.55,roughness:.42}));m.position.set(cx-.3,(H+RR)/2+.48,z*2.62);m.rotation.x=z*slope;m.castShadow=m.receiveShadow=true;sc.add(m);});
box(LEN+.6,.12,.5,mat(0x2a3038,{metalness:.5,roughness:.4}),cx-.3,RR+.42,0);
// gable with gate hole
const shp=new THREE.Shape();shp.moveTo(-5,0);shp.lineTo(5,0);shp.lineTo(5,H);shp.lineTo(0,RR);shp.lineTo(-5,H);shp.lineTo(-5,0);
const hole=new THREE.Path();hole.moveTo(-1.75,0);hole.lineTo(1.75,0);hole.lineTo(1.75,3.5);hole.lineTo(-1.75,3.5);hole.lineTo(-1.75,0);shp.holes.push(hole);
const gt=rib('#7b8794','#4c555f',4,.25,.25);const gm=new THREE.Mesh(new THREE.ShapeGeometry(shp),mat(0xffffff,{map:gt,metalness:.5,roughness:.42,side:THREE.DoubleSide}));gm.rotation.y=-Math.PI/2;gm.position.set(-25.12,.1,0);gm.castShadow=true;sc.add(gm);
const trim=mat(0x1f252c,{metalness:.5,roughness:.4});
[[-25.2,-5.25],[-25.2,5.25]].forEach(p=>box(.16,H+.05,.16,trim,p[0],H/2+.12,p[1]));box(.1,.14,3.8,trim,-25.16,3.62,0);
// gate leaves open
const gM=mat(0xed760e,{metalness:.35,roughness:.45});
[-1,1].forEach(s=>{const pv=new THREE.Group();pv.position.set(-25.2,.1,s*1.75);const l=box(.06,3.5,1.75,gM,0,1.75,-s*.875,pv);pv.rotation.y=s*1.15;sc.add(pv);});
// interior warm light
const il=new THREE.PointLight(0xffc47a,3.2,40,1.6);il.position.set(-20,3.2,0);sc.add(il);
const glow=new THREE.Mesh(new THREE.PlaneGeometry(3.5,3.5),new THREE.MeshBasicMaterial({color:0xffcf8f,transparent:true,opacity:.55}));glow.rotation.y=-Math.PI/2;glow.position.set(-24.9,1.85,0);sc.add(glow);
// crane next to unfinished part
const y=mat(0xf2c94c,{metalness:.3,roughness:.5});
box(10,.9,2.5,y,18,1.15,12);box(2,2,2.5,y,23.6,1.9,12);
[-3.8,-2.4,-1,3,4.6].forEach(dx=>[-1.15,1.15].forEach(dz=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.45,16),mat(0x15181b));w.rotation.x=Math.PI/2;w.position.set(18+dx,.55,12+dz);sc.add(w);}));
const tp=new V3(16.2,2.8,12),tip=new V3(13,12.5,1.5);const d=tip.clone().sub(tp);
const bg=new THREE.BoxGeometry(.6,.6,d.length());const bm=new THREE.Mesh(bg,y);bm.position.copy(tp).add(tip).multiplyScalar(.5);bm.lookAt(tip);bm.castShadow=true;sc.add(bm);
box(3,1,2.2,y,16.2,2.2,12);
const cab=new THREE.Line(new THREE.BufferGeometry().setFromPoints([tip,new V3(13,7.6,1.5)]),new THREE.LineBasicMaterial({color:0x1a1a1a}));sc.add(cab);
// a lifted roof sheet pack
box(1.2,.35,5.8,roofM,13,7.3,1.5);
// stacks on ground
box(1.2,.5,5.8,roofM,30,.35,-9);box(1.2,.5,5.8,wallM,31.6,.35,-9);
for(let i=0;i<3;i++)box(12,.35,.5,mFr,33,.25+i*.36,4+i*.0);
r.render(sc,cam);window.__done=true;
</script></body></html>
